# Sprint 23, task 23.3 — Locale pt-BR do Devise (projeto é I18n pt-BR
# estrito, ver config/application.rb `default_locale`). Baseado no conjunto
# de traduções canônico do devise-i18n, limitado aos módulos usados pelo
# model User (database_authenticatable, registerable, recoverable,
# rememberable, validatable, trackable).
pt-BR:
  devise:
    confirmations:
      confirmed: "Sua conta foi confirmada com sucesso."
      send_instructions: "Você receberá um e-mail com instruções para confirmar sua conta em alguns minutos."
      send_paranoid_instructions: "Se seu e-mail existir em nosso banco de dados, você receberá um e-mail com instruções para confirmar sua conta em alguns minutos."
    failure:
      already_authenticated: "Você já está logado."
      inactive: "Sua conta ainda não foi ativada."
      # Task 23.6 — o Frequencia autentica por `username` (não email);
      # mensagens de falha refletem a chave de autenticação do projeto.
      invalid: "Username ou senha inválidos."
      invalid_token: "Token de autenticação inválido."
      locked: "Sua conta está bloqueada."
      last_attempt: "Você tem mais uma tentativa antes de sua conta ser bloqueada."
      not_found_in_database: "Username ou senha inválidos."
      timeout: "Sua sessão expirou. Por favor, faça login novamente para continuar."
      unauthenticated: "Para continuar, faça login."
      unconfirmed: "Antes de continuar, confirme sua conta."
    mailer:
      confirmation_instructions:
        subject: "Instruções de confirmação"
      reset_password_instructions:
        subject: "Instruções de redefinição de senha"
      unlock_instructions:
        subject: "Instruções de desbloqueio"
    omniauth_callbacks:
      failure: "Não foi possível autenticar você de %{kind} porque \"%{reason}\"."
      success: "Autenticado com sucesso de %{kind}."
    passwords:
      no_token: "Você não pode acessar esta página sem estar logado ou sem ter vindo de um e-mail de redefinição de senha. Se você veio do e-mail, certifique-se de ter usado a URL exata fornecida."
      send_instructions: "Você receberá um e-mail com instruções para redefinir sua senha em alguns minutos."
      send_paranoid_instructions: "Se seu e-mail existir em nosso banco de dados, você receberá um e-mail com um link para redefinir sua senha."
      updated: "Sua senha foi alterada com sucesso. Você agora está autenticado."
      updated_not_active: "Sua senha foi alterada com sucesso."
      # B1 (bug_report_23_cs): mensagem de degradação controlada quando o
      # ActionMailer NÃO está montado (envio do e-mail de recuperação
      # impossível). Exibida como flash alert após redirect para a tela de
      # login — nunca 500.
      mail_unavailable: "Não foi possível enviar o e-mail de recuperação de senha (serviço de e-mail não configurado). Entre em contato com o administrador do sistema."
      # Task 23.8 — chaves das views de recuperação de senha (padrão
      # canônico do devise-i18n, namespace `devise.*`).
      new:
        forgot_your_password: "Esqueceu sua senha?"
        send_me_reset_password_instructions: "Enviar instruções de redefinição de senha"
        app_title: "API Ponto TJPI"
        subtitle: "Recupere o acesso ao painel administrativo"
      edit:
        change_your_password: "Alterar sua senha"
        new_password: "Nova senha"
        confirm_new_password: "Confirmar nova senha"
        change_my_password: "Alterar minha senha"
        app_title: "API Ponto TJPI"
        subtitle: "Defina uma nova senha para seu acesso"
    registrations:
      destroyed: "Sua conta foi cancelada com sucesso."
      signed_up: "Cadastro realizado com sucesso."
      signed_up_but_inactive: "Você se cadastrou com sucesso. No entanto, não pudemos autenticá-lo porque sua conta ainda não está ativada."
      signed_up_but_locked: "Você se cadastrou com sucesso. No entanto, não pudemos autenticá-lo porque sua conta está bloqueada."
      signed_up_but_unconfirmed: "Uma mensagem com link de confirmação foi enviada para seu e-mail. Ative sua conta para continuar."
      update_needs_confirmation: "Você atualizou sua conta com sucesso, mas precisamos confirmar seu novo e-mail. Por favor, verifique sua caixa de entrada."
      updated: "Sua conta foi atualizada com sucesso."
    sessions:
      signed_in: "Login realizado com sucesso."
      signed_out: "Logout realizado com sucesso."
      already_signed_out: "Logout já realizado."
      # Task 23.8 — chaves da view de login (`users/sessions/new`).
      # `username`/`password` são a identidade visual do projeto (auth por
      # username, não email — ver task 23.6); `app_title`/`subtitle`
      # alimentam o header do card (partial `users/shared/_card_header`).
      new:
        username: "Usuário"
        password: "Senha"
        sign_in: "Entrar"
        remember_me: "Lembrar de mim"
        app_title: "API Ponto TJPI"
        subtitle: "Faça login no painel administrativo"
    shared:
      minimum_password_length: "mínimo de %{count} caracteres"
    links:
      sign_in: "Entrar"
      forgot_your_password: "Esqueceu sua senha?"
    unlocks:
      send_instructions: "Você receberá um e-mail em alguns minutos com instruções para desbloquear sua conta."
      send_paranoid_instructions: "Se sua conta existir, você receberá um e-mail com instruções para desbloquear sua conta."
      unlocked: "Sua conta foi desbloqueada com sucesso. Faça login para continuar."
  errors:
    messages:
      already_confirmed: "já foi confirmado"
      confirmation_period_expired: "precisa ser confirmada em até %{period}, por favor, solicite um novo"
      expired: "expirou, por favor, solicite um novo"
      not_found: "não encontrado"
      not_locked: "não estava bloqueado"
      not_saved:
        one: "1 erro impediu que %{resource} fosse salvo:"
        other: "%{count} erros impediram que %{resource} fosse salvo:"